<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카카오 캐러셀 피드 미리보기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1>카카오 캐러셀 피드 미리보기</h1>
      <p>이미지, 타이틀, 본문, CTA를 입력하면 카카오톡 형태로 바로 확인할 수 있습니다.</p>
    </div>
    <div class="topBtns">
      <button id="allBtn" class="btn ghost">한번에 보기</button>
      <button id="addCard" class="btn dark">+ 캐러셀 추가</button>
    </div>
  </header>

  <main id="layout" class="layout">
    <section id="preview" class="preview">
      <div class="brand">
        <div id="brandLogo" class="brandLogo">DEFENDER</div>
        <div id="brandName" class="brandName">(광고)DEFENDER</div>
      </div>
      <div class="track" id="track"></div>
      <div class="dots" id="dots"></div>
    </section>

    <section id="formPanel" class="form">
      <div id="tabs" class="tabs"></div>
      <div class="formHead">
        <div>
          <h2 id="formTitle">카드 1 입력</h2>
          <p>기본 2개, 최대 6개까지 구성 가능합니다.</p>
        </div>
        <button id="removeCard" class="miniBtn">삭제</button>
      </div>

      <div class="fields">
        <div class="field">
          <label>브랜드명 <b>*</b></label>
          <select id="brandSelect">
            <option value="DEFENDER">(광고)DEFENDER</option>
            <option value="Range Rover">(광고)Range Rover</option>
            <option value="Discovery">(광고)Discovery</option>
          </select>
        </div>

        <div class="field imageField">
          <label>이미지 <b>*</b></label>
          <div class="imageRow">
            <button id="imageBtn" class="imageBtn">
              <img id="thumb" alt="">
              <span>▧<br>이미지 삽입</span>
            </button>
            <div class="imageGuide">권장 사이즈: <strong>600 × 800px</strong></div>
            <input id="imageInput" type="file" accept="image/*" hidden>
          </div>
        </div>

        <div id="titleField" class="field">
          <label>타이틀 <b>*</b></label>
          <div class="inputBox">
            <input id="titleInput" maxlength="20" placeholder="타이틀을 입력해주세요.">
            <em id="titleCount">0/20자</em>
          </div>
        </div>

        <div id="bodyField" class="field">
          <div class="labelRow">
            <label>내용 <b>*</b></label>
            <p id="breakCount">줄바꿈 0/2회</p>
          </div>
          <div class="textareaBox">
            <textarea id="bodyInput" maxlength="180" placeholder="내용을 입력해주세요."></textarea>
            <em id="bodyCount">0/180자</em>
          </div>
          <p class="err">본문 줄바꿈은 최대 2회까지만 권장됩니다. 줄바꿈을 줄이면 다시 정상 표시됩니다.</p>
        </div>

        <div id="ctaField" class="field">
          <div class="ctaTop">
            <label>CTA 버튼 <b>*</b></label>
            <button id="addCta" class="smallDark">CTA 추가</button>
          </div>
          <div id="ctaForms" class="ctaForms"></div>
          <p class="err">CTA 버튼은 최대 2개까지 추가할 수 있습니다.</p>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
